<!DOCTYPE html>
<html>
<head>
    <title>Sorry</title>
    <style>
    	body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: center; /* vertical center */
    align-items: center;     /* horizontal center */

    text-align: center;
    font-family: Arial, sans-serif;
    background: black;
}
        .warn-box {
            display: flex;
            gap: 16px;
            align-items: center;
            max-width: 700px;
            padding: 18px;
            margin-top: 20px;
            background: #ff6f52;
            border: 3px solid #550000;
            border-radius: 14px;
            font-family: Arial, sans-serif;
        }

        .warn-icon {
            min-width: 70px;
            height: 70px;
            background: #aa0000;
            border: 4px solid #7a5b00;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.4);
        }

        .warn-content h2 {
            margin: 0 0 6px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
	
        .warn-content p {
            margin: 0;
            font-size: 15px;
            line-height: 1.5;
            color: #3a2f00;
        }

        .bolder {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="warn-box">
        <div class="warn-icon">!</div>

        <div class="warn-content">
            <h2>Important Information</h2>
            <p>
                JanekTech website is currently unavailable due to the server failure.
                All of the applications that require connection to janektech servers will fail!
                Site will be probably moved to my server and redesigned.
            </p>
            <h2>Sorry for the inconvenience</h2>
        </div>
    </div>
</body>
</html>
